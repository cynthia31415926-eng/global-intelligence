<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>全球资讯看板</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;display:grid;place-items:center;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",sans-serif;
    background:radial-gradient(120% 100% at 80% -10%,rgba(10,132,255,.14),transparent 55%),
               radial-gradient(110% 100% at 0% 110%,rgba(191,90,242,.12),transparent 55%),#f5f5f7;
    color:#1d1d1f;-webkit-font-smoothing:antialiased;padding:20px;
  }
  .card{text-align:center;max-width:420px;width:100%}
  .logo{width:64px;height:64px;border-radius:18px;margin:0 auto 20px;position:relative;
    background:conic-gradient(from 210deg,#0a84ff,#bf5af2,#ff375f,#ff9f0a,#30d158,#0a84ff);
    box-shadow:0 8px 28px rgba(10,132,255,.3)}
  .logo::after{content:"";position:absolute;inset:11px;border-radius:12px;background:rgba(255,255,255,.55)}
  .logo i{position:absolute;inset:0;margin:auto;width:18px;height:18px;border-radius:50%;background:#fff;z-index:2}
  h1{font-size:26px;font-weight:800;letter-spacing:-.03em}
  .sub{font-size:13px;color:#86868b;font-weight:600;margin:8px 0 28px}
  .btns{display:grid;gap:12px}
  a.btn{display:flex;align-items:center;justify-content:center;gap:10px;
    padding:15px;border-radius:16px;background:#fff;border:1px solid rgba(0,0,0,.08);
    font-size:16px;font-weight:650;color:#1d1d1f;text-decoration:none;
    box-shadow:0 10px 30px rgba(0,0,0,.06);transition:transform .2s,box-shadow .2s}
  a.btn:active{transform:scale(.97)}
  a.btn:hover{box-shadow:0 16px 40px rgba(0,0,0,.1)}
  a.btn small{color:#86868b;font-weight:500;font-size:12px}
</style>
</head>
<body>
  <div class="card">
    <div class="logo"><i></i></div>
    <h1>全球资讯看板</h1>
    <div class="sub">Global Intelligence · To B / To G · 近3天 · 每日 09:00 更新</div>
    <div class="btns">
      <a class="btn" href="m.html">📱 手机版 <small>iPhone / 安卓</small></a>
      <a class="btn" href="d.html">🖥 桌面版 <small>电脑浏览器</small></a>
    </div>
  </div>
<script>
  if(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) location.replace('m.html');
</script>
</body>
</html>
