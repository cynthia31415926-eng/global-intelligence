<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>全球资讯看板 · Global Intelligence</title>
<style>
  :root{
    --bg:#050507;
    --bg-elev:#0c0c0f;
    --card:rgba(255,255,255,.055);
    --card-hover:rgba(255,255,255,.09);
    --stroke:rgba(255,255,255,.09);
    --stroke-soft:rgba(255,255,255,.06);
    --text:#f5f5f7;
    --text-2:#c7c7cc;
    --text-3:#86868b;
    --blue:#0a84ff;
    --green:#30d158;
    --orange:#ff9f0a;
    --red:#ff453a;
    --purple:#bf5af2;
    --cyan:#64d2ff;
    --pink:#ff375f;
    --teal:#40c8c0;
    --radius:18px;
    --radius-sm:12px;
    --shadow:0 24px 70px rgba(0,0,0,.55);
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
    --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,monospace;
    --nav-h:60px;
  }
  html[data-theme="light"]{
    --bg:#f5f5f7;
    --bg-elev:#ffffff;
    --card:#ffffff;
    --card-hover:#fafafc;
    --stroke:rgba(0,0,0,.08);
    --stroke-soft:rgba(0,0,0,.055);
    --text:#1d1d1f;
    --text-2:#6e6e73;
    --text-3:#86868b;
    --shadow:0 16px 44px rgba(0,0,0,.07);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:var(--font);
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    letter-spacing:-.012em;
    min-height:100vh;
    overflow-x:hidden;
    transition:background .45s ease,color .45s ease;
  }
  ::selection{background:rgba(10,132,255,.3)}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit}

  /* ambient glow */
  .glow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .glow i{position:absolute;border-radius:50%;filter:blur(110px);opacity:.22}
  .glow i.g1{width:58vw;height:58vw;left:-16vw;top:-22vw;background:radial-gradient(circle,#0a84ff,transparent 62%)}
  .glow i.g2{width:50vw;height:50vw;right:-14vw;top:24vh;background:radial-gradient(circle,#bf5af2,transparent 62%)}
  .glow i.g3{width:40vw;height:40vw;left:30vw;bottom:-18vw;background:radial-gradient(circle,#30d158,transparent 62%);opacity:.12}
  html[data-theme="light"] .glow i{opacity:.1}

  /* ---------- navbar ---------- */
  .navbar{
    position:sticky;top:0;z-index:60;height:var(--nav-h);
    background:var(--bg);
    background:color-mix(in srgb,var(--bg) 72%,transparent);
    -webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
    border-bottom:1px solid var(--stroke-soft);
  }
  .navbar-inner{
    max-width:1520px;margin:0 auto;height:100%;
    padding:0 clamp(16px,3vw,44px);
    display:flex;align-items:center;gap:22px;
  }
  .brand{display:flex;align-items:center;gap:12px;flex:0 0 auto}
  .logo{
    width:34px;height:34px;border-radius:10px;position:relative;flex:0 0 auto;
    background:conic-gradient(from 210deg,#0a84ff,#bf5af2,#ff375f,#ff9f0a,#30d158,#0a84ff);
    box-shadow:0 4px 14px rgba(10,132,255,.35);
  }
  .logo::after{content:"";position:absolute;inset:6px;border-radius:7px;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
  .logo i{position:absolute;inset:0;margin:auto;width:12px;height:12px;border-radius:50%;background:#fff;z-index:2;box-shadow:0 0 10px #fff}
  html[data-theme="light"] .logo::after{background:rgba(255,255,255,.75)}
  .brand .t1{font-size:16.5px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
  .brand .t2{font-size:10.5px;color:var(--text-3);font-weight:500;letter-spacing:.02em}

  .nav-tabs{display:flex;gap:2px;flex:1 1 auto;overflow-x:auto;scrollbar-width:none;align-items:center;height:100%}
  .nav-tabs::-webkit-scrollbar{display:none}
  .tab{
    position:relative;border:none;background:none;cursor:pointer;white-space:nowrap;
    font-size:14px;font-weight:600;color:var(--text-2);
    padding:0 15px;height:100%;display:inline-flex;align-items:center;gap:7px;
    transition:color .2s;
  }
  .tab:hover{color:var(--text)}
  .tab .tdot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:var(--c,var(--blue))}
  .tab.on{color:var(--text)}
  .tab.on::after{content:"";position:absolute;left:15px;right:15px;bottom:0;height:2px;border-radius:2px;background:var(--c,var(--blue))}
  .tab .tc{font-size:11px;color:var(--text-3);font-weight:500}

  .nav-actions{display:flex;gap:8px;align-items:center;flex:0 0 auto}
  .status{
    display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;color:var(--text-2);
    padding:7px 12px;border-radius:999px;background:var(--card);border:1px solid var(--stroke);
  }
  .status .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 9px var(--green);animation:pulse 2.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .ibtn{
    border:1px solid var(--stroke);cursor:pointer;width:36px;height:36px;border-radius:11px;
    display:grid;place-items:center;color:var(--text-2);background:var(--card);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    transition:all .2s;font-size:15px;
  }
  .ibtn:hover{color:var(--text);transform:translateY(-1px)}
  .ibtn.on{color:var(--blue);border-color:rgba(10,132,255,.45)}

  /* ---------- toolbar ---------- */
  .toolbar{
    max-width:1520px;margin:18px auto 0;padding:0 clamp(16px,3vw,44px);
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  }
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{
    border:1px solid var(--stroke);cursor:pointer;font-size:12.5px;font-weight:600;color:var(--text-2);
    padding:7px 13px;border-radius:999px;background:var(--card);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    transition:all .2s cubic-bezier(.2,.7,.3,1);white-space:nowrap;
  }
  .chip:hover{color:var(--text);transform:translateY(-1px)}
  .chip.on{color:#fff;background:var(--blue);border-color:transparent;box-shadow:0 4px 16px rgba(10,132,255,.35)}
  .toolbar .hint{margin-left:auto;font-size:12px;color:var(--text-3);font-weight:500}

  /* ---------- shell ---------- */
  .shell{max-width:1520px;margin:0 auto;padding:0 clamp(16px,3vw,44px)}

  /* ---------- hero ---------- */
  .hero{
    position:relative;overflow:hidden;margin:22px 0 26px;
    border-radius:28px;border:1px solid var(--stroke);
    background:
      radial-gradient(130% 160% at 88% -18%,rgba(191,90,242,.34),transparent 52%),
      radial-gradient(120% 150% at 8% 130%,rgba(10,132,255,.36),transparent 55%),
      linear-gradient(160deg,#15151b 0%,#09090d 100%);
    box-shadow:var(--shadow);
    display:flex;align-items:stretch;
  }
  html[data-theme="light"] .hero{
    background:
      radial-gradient(130% 160% at 88% -18%,rgba(191,90,242,.14),transparent 52%),
      radial-gradient(120% 150% at 8% 130%,rgba(10,132,255,.16),transparent 55%),
      linear-gradient(160deg,#ffffff 0%,#f3f3f7 100%);
  }
  .hero-main{flex:1 1 auto;padding:clamp(28px,4vw,54px);min-width:0}
  .eyebrow{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  .kicker{
    font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#fff;
    padding:6px 12px;border-radius:999px;background:linear-gradient(135deg,#0a84ff,#bf5af2);
    box-shadow:0 4px 16px rgba(10,132,255,.35);
  }
  .eyebrow .stamp{font-size:12.5px;color:var(--text-3);font-weight:500}
  .eyebrow .sep{width:3px;height:3px;border-radius:50%;background:var(--text-3)}
  .hero h1{
    font-size:clamp(30px,4.6vw,56px);font-weight:800;letter-spacing:-.032em;line-height:1.04;
    max-width:15ch;margin-bottom:16px;
  }
  .hero .lead{font-size:clamp(14.5px,1.5vw,17px);color:var(--text-2);max-width:58ch;line-height:1.62;margin-bottom:24px}
  .hero-meta{display:flex;gap:20px;flex-wrap:wrap;font-size:12.5px;color:var(--text-3);margin-bottom:26px}
  .hero-meta b{color:var(--text);font-weight:600}
  .cta{
    display:inline-flex;align-items:center;gap:8px;font-size:14.5px;font-weight:600;color:#fff;
    padding:11px 22px;border-radius:999px;background:var(--blue);
    box-shadow:0 6px 20px rgba(10,132,255,.4);transition:all .2s;
  }
  .cta:hover{transform:translateY(-1px);box-shadow:0 10px 28px rgba(10,132,255,.5)}
  .cta .arr{transition:transform .2s}
  .cta:hover .arr{transform:translateX(3px)}

  .hero-visual{flex:0 0 auto;width:clamp(220px,24vw,320px);display:grid;place-items:center;padding:20px}
  .orb{position:relative;width:clamp(170px,17vw,230px);aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.25),transparent 40%),conic-gradient(from 210deg,#0a84ff,#bf5af2,#ff375f,#ff9f0a,#0a84ff);
    display:grid;place-items:center;box-shadow:0 20px 60px rgba(10,132,255,.35),inset 0 0 0 1px rgba(255,255,255,.18);
  }
  .orb::after{content:"";position:absolute;inset:14px;border-radius:50%;background:rgba(6,6,10,.42);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  html[data-theme="light"] .orb::after{background:rgba(255,255,255,.5)}
  .orb-core{position:relative;z-index:2;text-align:center;color:#fff}
  html[data-theme="light"] .orb-core{color:#1d1d1f}
  .orb-core .n{font-size:clamp(52px,6vw,76px);font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
  .orb-core .l{font-size:12px;font-weight:600;letter-spacing:.18em;opacity:.8;margin-top:6px}
  .ring{position:absolute;inset:-16px;border-radius:50%;border:1px dashed rgba(255,255,255,.25);animation:spin 30s linear infinite}
  html[data-theme="light"] .ring{border-color:rgba(0,0,0,.18)}
  .sat{position:absolute;width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 12px rgba(255,255,255,.9);z-index:1}
  html[data-theme="light"] .sat{background:#0a84ff;box-shadow:0 0 12px rgba(10,132,255,.7)}
  .sat.s1{top:-4px;left:50%}.sat.s2{right:6px;bottom:22%}.sat.s3{left:4px;bottom:30%}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- market strip ---------- */
  .strip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:0 0 26px}
  .stat{
    border-radius:var(--radius);padding:18px 20px;background:var(--card);
    border:1px solid var(--stroke);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
    display:flex;flex-direction:column;gap:8px;transition:transform .25s,border-color .25s;
    position:relative;overflow:hidden;
  }
  .stat:hover{transform:translateY(-3px);border-color:var(--text-3)}
  .stat::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--c,#0a84ff),transparent)}
  .stat .k{font-size:11.5px;color:var(--text-3);font-weight:600;letter-spacing:.03em}
  .stat .v{font-size:clamp(24px,2.6vw,32px);font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .stat .v .unit{font-size:.5em;font-weight:600;color:var(--text-3);margin-left:3px}
  .stat .d{font-size:11.5px;color:var(--text-3);display:flex;align-items:center;gap:7px}
  .up{color:var(--green)}.down{color:var(--red)}.flat{color:var(--orange)}

  /* ---------- layout ---------- */
  .grid{display:grid;grid-template-columns:minmax(0,1fr) 352px;gap:22px;align-items:start}
  .feed{display:flex;flex-direction:column;gap:30px;min-width:0}
  .side{display:flex;flex-direction:column;gap:18px;min-width:0}

  /* section head */
  .sec-head{display:flex;align-items:center;gap:11px;margin-bottom:14px}
  .sec-dot{width:9px;height:9px;border-radius:50%;background:var(--c,#0a84ff);box-shadow:0 0 12px var(--c,#0a84ff)}
  .sec-head h2{font-size:19px;font-weight:800;letter-spacing:-.02em}
  .sec-head .en{font-size:10.5px;color:var(--text-3);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
  .sec-head .cnt{font-size:11.5px;color:var(--text-3);font-weight:600;background:var(--card);border:1px solid var(--stroke-soft);padding:3px 9px;border-radius:999px}
  .sec-head .sub{margin-left:auto;font-size:12px;color:var(--text-3);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .card{
    border-radius:var(--radius);background:var(--card);border:1px solid var(--stroke);
    -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
    padding:20px 22px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;
    transition:transform .28s cubic-bezier(.2,.7,.3,1),background .28s,border-color .28s,box-shadow .28s;
  }
  .card:hover{transform:translateY(-3px);background:var(--card-hover);border-color:rgba(255,255,255,.18);box-shadow:var(--shadow)}
  html[data-theme="light"] .card:hover{border-color:rgba(0,0,0,.16)}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,#0a84ff);opacity:0;transition:opacity .3s}
  .card:hover::before{opacity:1}
  .card-top{display:flex;align-items:center;gap:8px}
  .tpill{font-size:10.5px;font-weight:650;letter-spacing:.03em;padding:3.5px 9px;border-radius:6px;background:var(--card-strong,var(--card-hover));border:1px solid var(--stroke-soft);color:var(--text-2)}
  .aud{font-size:10px;font-weight:700;letter-spacing:.05em;padding:3.5px 8px;border-radius:6px;border:1px solid}
  .aud.b{color:var(--blue);border-color:rgba(10,132,255,.4)}
  .aud.g{color:var(--green);border-color:rgba(48,209,88,.4)}
  .card-top .time{margin-left:auto;font-size:11px;color:var(--text-3);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
  .card h3{font-size:15.5px;font-weight:680;letter-spacing:-.015em;line-height:1.38}
  .card .desc{font-size:13px;color:var(--text-2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card-foot{display:flex;align-items:center;gap:10px;margin-top:auto;font-size:11.5px;color:var(--text-3)}
  .card-foot .src{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card-foot .tags{margin-left:auto;display:flex;gap:6px;flex:0 0 auto}
  .tag{font-size:10.5px;font-weight:600;padding:2.5px 8px;border-radius:6px;background:var(--stroke-soft);color:var(--text-2);border:1px solid transparent}

  /* ---------- sidebar ---------- */
  .panel{border-radius:var(--radius);background:var(--card);border:1px solid var(--stroke);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);overflow:hidden}
  .panel-head{display:flex;align-items:center;gap:10px;padding:16px 18px 10px}
  .panel-head h3{font-size:15px;font-weight:750;letter-spacing:-.015em}
  .panel-head .n{font-size:11px;color:var(--text-3);font-weight:600;background:var(--stroke-soft);border-radius:999px;padding:2px 8px}
  .panel-head .more{margin-left:auto;font-size:12px;color:var(--blue);font-weight:600}
  .panel-head .more:hover{text-decoration:underline}
  .mini{display:block;padding:13px 18px;border-bottom:1px solid var(--stroke-soft);transition:background .2s}
  .mini:last-child{border-bottom:none}
  .mini:hover{background:var(--card-hover)}
  .mini .row1{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .mini .t{font-size:13px;font-weight:650;line-height:1.42;letter-spacing:-.01em}
  .mini .sub{font-size:11px;color:var(--text-3);margin-top:5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .mini .sub .src{font-weight:500}
  .mini .sub .tag{font-size:10px}

  .gh-row{display:flex;gap:13px;padding:14px 18px;border-bottom:1px solid var(--stroke-soft);align-items:flex-start}
  .gh-row:last-child{border-bottom:none}
  .gh-rank{font-size:19px;font-weight:800;font-family:var(--mono);color:var(--text-3);width:26px;flex:0 0 auto;line-height:1.3}
  .gh-body{min-width:0;flex:1}
  .gh-name{font-size:13.5px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:6px}
  .gh-name .octo{opacity:.55;font-size:11px}
  .gh-desc{font-size:12px;color:var(--text-2);line-height:1.5;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .gh-meta{display:flex;gap:12px;align-items:center;margin-top:7px;font-size:11px;color:var(--text-3)}
  .gh-meta .star{color:#f5c542}
  .gh-link{flex:0 0 auto;margin-top:2px}

  /* ---------- empty ---------- */
  .empty{text-align:center;padding:70px 20px;color:var(--text-3);border:1px dashed var(--stroke);border-radius:var(--radius)}
  .empty .big{font-size:38px;margin-bottom:10px}
  .empty p{font-size:14px}

  /* ---------- footer ---------- */
  footer{max-width:1520px;margin:36px auto 28px;padding:24px clamp(16px,3vw,44px) 0;border-top:1px solid var(--stroke-soft)}
  .sources{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .src-pill{font-size:11px;color:var(--text-2);padding:5px 11px;border-radius:999px;background:var(--card);border:1px solid var(--stroke-soft)}
  .foot-note{font-size:12px;color:var(--text-3);line-height:1.75;max-width:86ch}

  /* ---------- responsive ---------- */
  body.mobile-mode .grid{grid-template-columns:1fr}
  body.mobile-mode .cards{grid-template-columns:1fr}
  body.mobile-mode .strip{grid-template-columns:repeat(2,1fr)}
  body.mobile-mode .hero{flex-direction:column}
  body.mobile-mode .hero-visual{width:100%;padding:0 20px 26px}
  body.mobile-mode .status{display:none}

  @media (max-width:1120px){
    .grid{grid-template-columns:1fr}
    .side{order:5}
  }
  @media (max-width:760px){
    .nav-actions .status{display:none}
    .toolbar .hint{margin-left:0;width:100%}
    .cards{grid-template-columns:1fr}
    .strip{grid-template-columns:repeat(2,1fr);gap:10px}
    .hero{border-radius:22px}
    .hero h1{font-size:clamp(27px,8vw,36px)}
    .hero-visual{display:none}
    .card{padding:17px 18px}
    .sec-head .sub{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="glow"><i class="g1"></i><i class="g2"></i><i class="g3"></i></div>

<nav class="navbar">
  <div class="navbar-inner">
    <div class="brand">
      <div class="logo"><i></i></div>
      <div>
        <div class="t1">全球资讯看板</div>
        <div class="t2" id="brandSub">Global Intelligence</div>
      </div>
    </div>
    <div class="nav-tabs" id="indTabs"></div>
    <div class="nav-actions">
      <div class="status"><span class="dot"></span><span id="updateStatus">今日 09:00 已更新</span></div>
      <button class="ibtn" id="themeBtn" title="深浅色切换">◐</button>
      <button class="ibtn" id="deviceBtn" title="桌面 / 手机视图">▣</button>
      <button class="ibtn" id="fsBtn" title="全屏（壁纸模式）">⤢</button>
    </div>
  </div>
</nav>

<div class="toolbar">
  <div class="chips" id="typeChips"></div>
  <span class="hint" id="feedHint">近 3 天 · 自动扩充同类优质源</span>
</div>

<main class="shell">
  <section class="hero" id="hero"></section>
  <section class="strip" id="marketStrip"></section>
  <div class="grid">
    <div class="feed" id="feed"></div>
    <aside class="side">
      <div class="panel">
        <div class="panel-head"><span class="sec-dot" style="--c:var(--green)"></span><h3>广东 · 广州政策风向</h3><span class="n" id="policyN"></span></div>
        <div id="policyList"></div>
      </div>
      <div class="panel">
        <div class="panel-head"><span class="sec-dot" style="--c:var(--orange)"></span><h3>招投标 · 课题发布</h3><span class="n" id="tenderN"></span></div>
        <div id="tenderList"></div>
      </div>
      <div class="panel">

function renderFeed(){
  const feed = document.getElementById("feed");

    document.getElementById("feedHint").textContent = "近 3 天 · 0 条";
    return;
  }
  let html = "";
  for(const m of INDUSTRIES){
    const items = list.filter(d=>d.ind===m.key);
    if(!items.length) continue;
    html += `
    <section>
      <div class="sec-head">
        <span class="sec-dot" style="--c:${m.color}"></span>
        <h2>${m.name}</h2>
        <span class="en">${m.en}</span>
        <span class="cnt">${items.length} 条</span>
        <span class="sub">${m.sub}</span>
      </div>
      <div class="cards">${items.map(cardHtml).join("")}</div>
    </section>`;
  }
  feed.innerHTML = html;
  document.getElementById("feedHint").textContent = `近 3 天 · ${list.length} 条 · 自动扩充同类优质源`;
}

    <a class="mini" href="${esc(p.url)}" target="_blank" rel="noopener">
      <div class="row1"><span class="aud g">G</span><span style="margin-left:auto;font-size:11px;color:var(--text-3)">${esc(p.time)}</span></div>
      <div class="t">${esc(p.t)}</div>
      <div class="sub"><span class="src">${esc(p.src)}</span><span class="tag">${esc(p.tag)}</span></div>
    </a>`).join("");

  document.getElementById("tenderN").textContent = TENDER.length;
  document.getElementById("tenderList").innerHTML = TENDER.map(t=>`
    <a class="mini" href="${esc(t.url)}" target="_blank" rel="noopener">
      <div class="row1"><span class="aud b">B/G</span><span style="margin-left:auto;font-size:10.5px;font-weight:700;color:var(--orange)">${esc(t.amount)}</span></div>
      <div class="t">${esc(t.t)}</div>
      <div class="sub"><span class="src">${esc(t.src)}</span><span>${esc(t.time)}</span></div>
    </a>`).join("");

  const gh = DATA.filter(d=>d.ind==="gh");
  document.getElementById("githubList").innerHTML = gh.map((d,i)=>`
    <div class="gh-row">
      <div class="gh-rank">${i+1}</div>
      <div class="gh-body">
        <div class="gh-name"><span class="octo">◈</span>${esc(d.title.split("：")[0])}</div>
        <div class="gh-desc">${esc(d.desc)}</div>
        <div class="gh-meta"><span class="star">★ ${esc(d.stars||"—")}</span><span>${esc(d.time)}</span></div>
      </div>
      <a class="ibtn gh-link" href="${esc(d.url)}" target="_blank" rel="noopener" title="查看">↗</a>
    </div>`).join("");
}

function renderSources(){
  document.getElementById("sources").innerHTML = SOURCES.map(s=>`<span class="src-pill">${s}</span>`).join("");
  document.getElementById("footNote").innerHTML =
    `种子源（可继续补充）→ AI 自动扩充同类优质源 · 内容偏好 To B / To G · 重点关注产品动态、市场数据、广东/广州政策风向、项目课题与招投标 · 时效近 3 天 · 每日 09:00 更新。<br>说明：本看板为本地静态快照（数据截至 ${dateStr}），接入定时采集后可按天自动刷新。`;
}

/* ================= events ================= */
document.getElementById("indTabs").addEventListener("click",e=>{
  const t = e.target.closest(".tab"); if(!t) return;
  document.querySelectorAll("#indTabs .tab").forEach(x=>x.classList.remove("on"));
  t.classList.add("on");
  curInd = t.dataset.ind;
  renderFeed();
});
document.getElementById("typeChips").addEventListener("click",e=>{
  const c = e.target.closest(".chip"); if(!c) return;
  document.querySelectorAll("#typeChips .chip").forEach(x=>x.classList.remove("on"));
  c.classList.add("on");
  curType = c.dataset.type;
  renderFeed();
});
document.getElementById("themeBtn").addEventListener("click",()=>{
  const h = document.documentElement;
  h.dataset.theme = h.dataset.theme==="dark"?"light":"dark";
});
document.getElementById("deviceBtn").addEventListener("click",()=>{
  document.body.classList.toggle("mobile-mode");
  document.getElementById("deviceBtn").classList.toggle("on");
});
document.getElementById("fsBtn").addEventListener("click",()=>{
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
});
function autoMobile(){
  if(window.matchMedia("(max-width:640px)").matches) document.body.classList.add("mobile-mode");
}

/* ================= init ================= */
renderTabs();
renderChips();
renderHero();
renderStrip();
renderSide();
renderSources();
renderFeed();
autoMobile();
</script>
</body>
</html>
