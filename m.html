const IND = Object.fromEntries(INDUSTRIES.map(i=>[i.key,i]));
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const now = new Date();
const weekCN=["日","一","二","三","四","五","六"];
const dateStr=`${now.getMonth()+1}月${now.getDate()}日 · 周${weekCN[now.getDay()]}`;
document.getElementById("dateStr").textContent=dateStr;

let curInd="all";

/* segmented */
function renderSeg(){
  const el=document.getElementById("seg");
  let html=`<button class="s on" data-i="all" style="--c:#0a84ff">全部</button>`;
  html+=INDUSTRIES.map(m=>{
    const n=DATA.filter(d=>d.ind===m.key).length;
    return `<button class="s" data-i="${m.key}" style="--c:${m.color}"><span class="dot"></span>${esc(m.name)}<span class="n">${n}</span></button>`;
  }).join("");
  el.innerHTML=html;
}
document.getElementById("seg").addEventListener("click",e=>{
  const b=e.target.closest(".s"); if(!b) return;
  document.querySelectorAll("#seg .s").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); curInd=b.dataset.i;
  renderFeed();
});

/* feed view */
function feedList(){
  return DATA.filter(d=>curInd==="all"||d.ind===curInd);
}
function cardHtml(d){
  const m=IND[d.ind];
  const aud=d.aud==="toB"?"b":"g";
  return `<a class="card" href="${esc(d.url)}" target="_blank" rel="noopener">
    <div class="card-top"><span class="ind ${m.key}">${esc(m.name)}</span><span class="aud ${aud}">To ${d.aud==="toB"?"B":"G"}</span><span class="time">${esc(d.time)}</span></div>
    <h3>${esc(d.title)}</h3>
    <div class="desc">${esc(d.desc)}</div>
    <div class="card-foot"><span class="src">${esc(d.src)}</span><span class="tags">${(d.tags||[]).slice(0,2).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</span></div>
  </a>`;
}
function renderFeed(){
  const el=document.getElementById("view-feed");
  const list=feedList();
  const hero=`
    <div class="hero">
      <span class="kicker">● 今日头条 · AI</span>
      <h1>OpenAI 百亿融资落地</h1>
      <div class="lead">OpenAI 完成百亿美元融资，估值 1.25 万亿美元；Kimi 开放 2.8 万亿权重，AI 开源与产业化提速。</div>
      <div class="hmeta"><span><b>来源</b> AI 资讯日报</span><span><b>关注度</b> 97</span><span><b>时效</b> 近2天</span></div>
    </div>
    <div class="stats">
      <div class="stat c1"><div class="k">今日资讯</div><div class="v">${DATA.length}</div><div class="d">近3天 · 7大行业</div></div>
      <div class="stat c2"><div class="k">广东/广州政策</div><div class="v">${POLICY.length}</div><div class="d">AI · 低空</div></div>
      <div class="stat c3"><div class="k">招投标/课题</div><div class="v">${TENDER.length}</div><div class="d">To G 活跃</div></div>
      <div class="stat c4"><div class="k">GitHub 热门</div><div class="v">${DATA.filter(d=>d.ind==="gh").length}</div><div class="d">Agent 生态领涨</div></div>
    </div>`;
  if(!list.length){
    el.innerHTML=hero+`<div class="empty"><div class="big">🔍</div><p>该行业暂无资讯</p></div>`;
    return;
  }
  const cards=list.map(cardHtml).join("");
  el.innerHTML=hero+`<div class="sec"><div class="sec-head"><span class="dot" style="--c:#0a84ff"></span><h2>${curInd==="all"?"全部资讯":IND[curInd].name}</h2><span class="cnt">${list.length} 条</span></div>${cards}</div>`;
}

function renderGh(){

      <div class="gh-desc">${esc(d.desc)}</div>
      <div class="gh-meta"><span class="star">★ ${esc(d.stars||"—")}</span><span>${esc(d.time)}</span></div>

/* bottom tab bar */
document.getElementById("tabbar").addEventListener("click",e=>{
  const b=e.target.closest(".tb"); if(!b) return;
  document.querySelectorAll("#tabbar .tb").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("on"));
  document.getElementById("view-"+b.dataset.v).classList.add("on");
  window.scrollTo({top:0,behavior:"smooth"});
});

document.getElementById("themeBtn").addEventListener("click",()=>{
  const h=document.documentElement;
  h.dataset.theme=h.dataset.theme==="dark"?"light":"dark";
  document.querySelector('meta[name="theme-color"]').content=h.dataset.theme==="dark"?"#000000":"#f5f5f7";
});

renderSeg();
