    --text:#1d1d1f;
    --text-2:#6e6e73;
    --text-3:#86868b;
    --blue:#0a84ff;
    --green:#30d158;
    --orange:#ff9f0a;
    --red:#ff453a;
    --purple:#bf5af2;
    --teal:#40c8c0;

  html[data-theme="dark"]{

    --card:#1c1c1e;

    --stroke-soft:rgba(255,255,255,.07);

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{

  a{color:inherit;text-decoration:none}
  button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}

  .app{max-width:440px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
    padding-bottom:calc(env(safe-area-inset-bottom,0px) + 78px)}

  /* ---------- header ---------- */
  .topbar{
    position:sticky;top:0;z-index:50;
    padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 12px;
    background:color-mix(in srgb,var(--bg) 80%,transparent);
    -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
    border-bottom:1px solid var(--stroke-soft);
    display:flex;align-items:center;gap:12px;
  }
  .logo{width:32px;height:32px;border-radius:9px;flex:0 0 auto;
    background:conic-gradient(from 210deg,#0a84ff,#bf5af2,#ff375f,#ff9f0a,#30d158,#0a84ff);
    position:relative;box-shadow:0 3px 12px rgba(10,132,255,.3)}
  .logo::after{content:"";position:absolute;inset:6px;border-radius:6px;background:rgba(0,0,0,.5)}
  .logo i{position:absolute;inset:0;margin:auto;width:10px;height:10px;border-radius:50%;background:#fff;z-index:2}

  .topbar .t1{font-size:16px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
  .topbar .t2{font-size:10.5px;color:var(--text-3);font-weight:500;margin-top:2px}
  .round{
    width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
    background:var(--card);border:1px solid var(--stroke);color:var(--text-2);font-size:15px;
    transition:all .2s;
  }
  .round:active{transform:scale(.92)}

  /* ---------- segmented industry ---------- */
  .seg{display:flex;gap:8px;overflow-x:auto;padding:14px 18px 4px;scrollbar-width:none}
  .seg::-webkit-scrollbar{display:none}
  .seg .s{
    flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;
    font-size:13px;font-weight:600;color:var(--text-2);
    padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--stroke);
    transition:all .22s cubic-bezier(.2,.7,.3,1);
  }
  .seg .s .dot{width:7px;height:7px;border-radius:50%;background:var(--c,#0a84ff)}
  .seg .s.on{color:#fff;background:#1d1d1f;border-color:transparent}
  html[data-theme="dark"] .seg .s.on{background:#f5f5f7;color:#1d1d1f}
  .seg .s .n{font-size:10.5px;opacity:.6}

  /* ---------- main ---------- */
  main{flex:1;padding:14px 18px 0}
  .view{display:none;animation:fade .3s ease}
  .view.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* hero */
  .hero{
    position:relative;overflow:hidden;border-radius:22px;padding:20px;margin-bottom:14px;
    background:linear-gradient(150deg,#fff,#eef2ff);
    border:1px solid var(--stroke);box-shadow:0 10px 30px rgba(0,0,0,.05);
  }

  .hero h1{font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.12;margin:10px 0 8px}
  .hero .lead{font-size:13px;color:var(--text-2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .hero .hmeta{display:flex;gap:14px;margin-top:14px;font-size:11px;color:var(--text-3)}
  .hero .hmeta b{color:var(--text);font-weight:600}

  /* stats */
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px}
  .stat{background:var(--card);border:1px solid var(--stroke);border-radius:16px;padding:14px 15px}
  .stat .k{font-size:11px;color:var(--text-3);font-weight:600}
  .stat .v{font-size:26px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:4px}
  .stat .d{font-size:10.5px;color:var(--text-3);margin-top:3px}
  .stat.c1 .v{color:#0a84ff}.stat.c2 .v{color:#30a94f}.stat.c3 .v{color:#ff9f0a}.stat.c4 .v{color:#ff375f}

  /* section */
  .sec{margin-bottom:20px}
  .sec-head{display:flex;align-items:center;gap:8px;margin-bottom:11px}
  .sec-head .dot{width:8px;height:8px;border-radius:50%;background:var(--c,#0a84ff)}

  .sec-head .cnt{font-size:11px;color:var(--text-3);font-weight:600;margin-left:2px}

  /* card */
  .card{background:var(--card);border:1px solid var(--stroke);border-radius:var(--radius);
    padding:16px 17px;margin-bottom:11px;display:block;transition:transform .2s}

  .card-top{display:flex;align-items:center;gap:7px;margin-bottom:8px}

  .card-foot .tags{margin-left:auto;display:flex;gap:5px;flex:0 0 auto}
  .tag{font-size:10px;font-weight:600;padding:2.5px 7px;border-radius:6px;background:var(--stroke-soft);color:var(--text-2)}

  .item{background:var(--card);border:1px solid var(--stroke);border-radius:16px;padding:15px 16px;margin-bottom:10px;display:block;transition:transform .2s}

  .item .sub{font-size:11px;color:var(--text-3);margin-top:5px;display:flex;gap:8px;align-items:center}

  .gh-name{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
  .gh-desc{font-size:12px;color:var(--text-2);line-height:1.5;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  .gh-meta .star{color:#e6a700}

  .empty{text-align:center;padding:50px 20px;color:var(--text-3)}
  .empty .big{font-size:34px;margin-bottom:8px}

  .tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:60;
    display:flex;justify-content:space-around;align-items:stretch;

  }
  .tabbar .tb{

    padding:7px 4px 5px;border-radius:12px;color:var(--text-3);font-size:10px;font-weight:600;
    transition:color .2s;
  }
  .tabbar .tb svg{width:23px;height:23px}
  .tabbar .tb.on{color:var(--blue)}

  footer{max-width:440px;margin:10px auto 0;padding:0 18px;font-size:10.5px;color:var(--text-3);line-height:1.6}
</style>

const now = new Date();

let curInd="all";

/* segmented */
function renderSeg(){
  const el=document.getElementById("seg");
  let html=`<button class="s on" data-i="all" style="--c:#0a84ff">全部</button>`;
  html+=INDUSTRIES.map(m=>{
    const n=DATA.filter(d=>d.ind===m.key).length;
    return `<button class="s" data-i="${m.key}" style="--c:${m.color}"><span class="dot"></span>${esc(m.name)}<span class="n">${n}</span></button>`;
  }).join("");
  el.innerHTML=html;
}
document.getElementById("seg").addEventListener("click",e=>{
  const b=e.target.closest(".s"); if(!b) return;
  document.querySelectorAll("#seg .s").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); curInd=b.dataset.i;
  renderFeed();
});

/* feed view */
function feedList(){
  return DATA.filter(d=>curInd==="all"||d.ind===curInd);
}
function cardHtml(d){
  const m=IND[d.ind];
  const aud=d.aud==="toB"?"b":"g";
  return `<a class="card" href="${esc(d.url)}" target="_blank" rel="noopener">
    <div class="card-top"><span class="ind ${m.key}">${esc(m.name)}</span><span class="aud ${aud}">To ${d.aud==="toB"?"B":"G"}</span><span class="time">${esc(d.time)}</span></div>
    <h3>${esc(d.title)}</h3>
    <div class="desc">${esc(d.desc)}</div>
    <div class="card-foot"><span class="src">${esc(d.src)}</span><span class="tags">${(d.tags||[]).slice(0,2).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</span></div>
  </a>`;
}
function renderFeed(){
  const el=document.getElementById("view-feed");
  const list=feedList();
  const hero=`
    <div class="hero">
      <span class="kicker">● 今日头条 · AI</span>
      <h1>广东加快打造万亿级数字产业集群</h1>
      <div class="lead">广东加快打造万亿级数字产业集群，布局 AI 芯片设计与制造、光通信芯片等产业。</div>

    </div>
    <div class="stats">
      <div class="stat c1"><div class="k">今日资讯</div><div class="v">${DATA.length}</div><div class="d">近3天 · 7大行业</div></div>
      <div class="stat c2"><div class="k">广东/广州政策</div><div class="v">${POLICY.length}</div><div class="d">AI · 低空</div></div>
      <div class="stat c3"><div class="k">招投标/课题</div><div class="v">${TENDER.length}</div><div class="d">To G 活跃</div></div>
      <div class="stat c4"><div class="k">GitHub 热门</div><div class="v">${DATA.filter(d=>d.ind==="gh").length}</div><div class="d">Agent 生态领涨</div></div>
    </div>`;
  if(!list.length){
    el.innerHTML=hero+`<div class="empty"><div class="big">🔍</div><p>该行业暂无资讯</p></div>`;
    return;
  }
  const cards=list.map(cardHtml).join("");
  el.innerHTML=hero+`<div class="sec"><div class="sec-head"><span class="dot" style="--c:#0a84ff"></span><h2>${curInd==="all"?"全部资讯":IND[curInd].name}</h2><span class="cnt">${list.length} 条</span></div>${cards}</div>`;
}

/* bottom tab bar */
document.getElementById("tabbar").addEventListener("click",e=>{
  const b=e.target.closest(".tb"); if(!b) return;
  document.querySelectorAll("#tabbar .tb").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("on"));
  document.getElementById("view-"+b.dataset.v).classList.add("on");
  window.scrollTo({top:0,behavior:"smooth"});
});

document.getElementById("themeBtn").addEventListener("click",()=>{
  const h=document.documentElement;
  h.dataset.theme=h.dataset.theme==="dark"?"light":"dark";
  document.querySelector('meta[name="theme-color"]').content=h.dataset.theme==="dark"?"#000000":"#f5f5f7";
});
